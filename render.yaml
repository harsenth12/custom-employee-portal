databases:
  - name: employee-portal-db
    databaseName: employee_portal
    user: employee_portal
    plan: basic-256mb

services:
  - type: web
    name: custom-employee-portal-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DB_HOST
        fromDatabase:
          name: employee-portal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: employee-portal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: employee-portal-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: employee-portal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: employee-portal-db
          property: password
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REDIRECT_URI
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false

  - type: web
    name: custom-employee-portal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false